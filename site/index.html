<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mdflow | Markdown agents that evolve</title>

    <!-- Open Graph / Social Media Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mdflow.dev/" />
    <meta property="og:title" content="mdflow | Markdown agents that evolve" />
    <meta property="og:description" content="A Git-native control plane for agent workflows. Define flows once, run them on the engine you already use, inspect inputs, and gate changes with evals." />
    <meta property="og:image" content="https://mdflow.dev/og-image.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://mdflow.dev/" />
    <meta name="twitter:title" content="mdflow | Markdown agents that evolve" />
    <meta name="twitter:description" content="A Git-native control plane for agent workflows. Any engine. Inspectable inputs. Eval-gated revisions." />
    <meta name="twitter:image" content="https://mdflow.dev/og-image.png" />

    <!-- General Meta -->
    <meta name="description" content="A Git-native control plane for agent workflows. Run markdown flows on claude, codex, pi, cursor-agent, copilot, agy, or any CLI engine; inspect context and gate prompt revisions with evals." />
    <link rel="icon" href="/flow-mark.svg" type="image/svg+xml" />

    <!-- Self-hosted fonts (variable, latin + latin-ext subsets; files are
         version-named and served immutable — see vercel.json). Latin files
         are preloaded so text paints in the right face on first render;
         latin-ext only downloads when unicode-range demands it. -->
    <link rel="preload" href="/fonts/space-grotesk-v22-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/inter-v20-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/jetbrains-mono-v24-latin.woff2" as="font" type="font/woff2" crossorigin>
    <style>
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 400 800;
        font-display: swap;
        src: url(/fonts/inter-v20-latin-ext.woff2) format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 400 800;
        font-display: swap;
        src: url(/fonts/inter-v20-latin.woff2) format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'JetBrains Mono';
        font-style: normal;
        font-weight: 100 800;
        font-display: swap;
        src: url(/fonts/jetbrains-mono-v24-latin-ext.woff2) format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      @font-face {
        font-family: 'JetBrains Mono';
        font-style: normal;
        font-weight: 100 800;
        font-display: swap;
        src: url(/fonts/jetbrains-mono-v24-latin.woff2) format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Space Grotesk';
        font-style: normal;
        font-weight: 300 700;
        font-display: swap;
        src: url(/fonts/space-grotesk-v22-latin-ext.woff2) format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      @font-face {
        font-family: 'Space Grotesk';
        font-style: normal;
        font-weight: 300 700;
        font-display: swap;
        src: url(/fonts/space-grotesk-v22-latin.woff2) format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      /* Kill double-tap smart-zoom (the tap easter eggs need clean taps)
         while keeping pinch-zoom for accessibility */
      html {
        touch-action: manipulation;
      }
      /* Never let decorative overflow (stretch canvases, entrance
         transforms, blur blobs) widen the layout viewport — on iOS that
         expansion shoves fixed-position chrome (the nav's audio toggle)
         past the screen edge. `clip` forbids even programmatic panning;
         `hidden` is the older-engine fallback. */
      html, body {
        overflow-x: hidden;
        overflow-x: clip;
      }
      /* Custom Scrollbar for Cyber Aesthetic */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #09090b;
      }
      ::-webkit-scrollbar-thumb {
        background: #3f3f46;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #52525b;
      }
      body {
        background-color: #050505;
        color: #e4e4e7;
      }

      /* Background Grid Pattern */
      .bg-grid {
        background-size: 50px 50px;
        background-image: linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                          linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
        mask-image: linear-gradient(to bottom, black 40%, transparent 100%);
      }

      .text-glow {
        text-shadow: 0 0 20px rgba(249, 115, 22, 0.5);
      }

      /* When the WebGL guide layer is live (ShaderGuide adds .shader-fx),
         the EVOLVE glyphs become translucent windows and the mask-aligned
         aurora behind the content paints them. Without WebGL the word
         stays solid white. */
      html.shader-fx .evolve-live {
        color: rgba(244, 244, 245, 0.22);
      }
    </style>
</head>
  <body>
    <!-- The markup inside #root is a static copy of the hero's FINAL state
         (nav shell, badges, H1, subtitle) so the LCP paints from raw HTML
         instead of waiting for the React bundle. React replaces it wholesale
         on mount; Hero renders the same block without an entrance animation
         so the swap is pixel-identical. Every Tailwind class here must also
         appear in a component (or index.html, which Tailwind scans) to be
         generated. %FACTS_VERSION_BASE% is replaced from src/facts.json by
         the factsHtml plugin in vite.config.ts — keep badge copy in sync
         with Hero.tsx. -->
    <div id="root"><div class="min-h-screen bg-[#050505] text-zinc-100 font-sans">
      <div class="fixed inset-0 z-0 pointer-events-none">
        <div class="absolute inset-0 bg-grid opacity-20"></div>
        <div class="absolute top-0 left-0 w-full h-[500px] bg-gradient-to-b from-blue-900/10 to-transparent"></div>
      </div>
      <nav class="fixed top-0 w-full z-50 border-b border-white/5 bg-[#050505]/80 backdrop-blur-xl">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
          <div class="flex items-center gap-2 text-white font-display font-bold tracking-tighter text-2xl">
            <svg width="24" height="24" viewBox="0 0 16 16" fill="none" aria-hidden="true"><g stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="m2.5 4.5 3.5 3.5-3.5 3.5" opacity="0.3"/><path d="m6.5 4.5 3.5 3.5-3.5 3.5" opacity="0.6"/><path d="m10.5 4.5 3.5 3.5-3.5 3.5"/></g></svg>
            <span class="bg-clip-text text-transparent bg-gradient-to-r from-white to-zinc-400">mdflow</span>
          </div>
        </div>
      </nav>
      <main class="relative z-10">
        <div class="relative min-h-screen flex flex-col pt-32 lg:pt-40 pb-24 px-6 overflow-hidden">
          <div class="absolute top-[-20%] left-[-10%] w-[600px] h-[600px] bg-orange-600/20 blur-[150px] rounded-full pointer-events-none mix-blend-screen animate-pulse-slow"></div>
          <div class="absolute bottom-[-10%] right-[-10%] w-[800px] h-[800px] bg-blue-600/20 blur-[150px] rounded-full pointer-events-none mix-blend-screen animate-pulse-slow"></div>
          <div class="max-w-7xl mx-auto w-full z-10 grid grid-cols-1 lg:grid-cols-12 gap-16 items-center">
            <div class="lg:col-span-6 flex flex-col justify-center space-y-8">
              <div class="select-none">
                <div class="flex items-center gap-3 mb-8">
                  <div class="inline-flex items-center px-4 py-1.5 rounded-full border border-orange-500/50 bg-orange-950/30 text-xs font-mono text-orange-200 backdrop-blur-md shadow-[0_0_15px_rgba(249,115,22,0.3)]">
                    <svg width="12" height="12" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mr-2 text-orange-400 fill-orange-400" aria-hidden="true"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/></svg>
                    <span class="font-bold tracking-wider">V%FACTS_VERSION_BASE% LIVE</span>
                  </div>
                  <a href="https://github.com/johnlindquist/mdflow" target="_blank" rel="noopener noreferrer" class="inline-flex items-center px-4 py-1.5 rounded-full border border-pink-500/50 bg-pink-950/30 text-xs font-mono text-pink-200 backdrop-blur-md shadow-[0_0_15px_rgba(236,72,153,0.3)]">
                    <span class="font-bold tracking-wider">OPEN SOURCE ❤️</span>
                  </a>
                </div>
                <h1 class="select-none text-5xl lg:text-8xl font-display font-bold tracking-tighter text-white leading-[0.9] text-glow">
                  <span class="text-transparent bg-clip-text bg-gradient-to-r from-orange-400 via-amber-200 to-white">MARKDOWN AGENTS</span><br/>
                  THAT <a href="#evolve"><span class="evolve-live">EVOLVE.</span></a>
                </h1>
                <p class="mt-8 text-lg lg:text-xl text-zinc-300 leading-relaxed font-light border-l-4 border-orange-500/50 pl-6">
                  One file per <span class="text-white font-semibold">agent</span>. Any engine.<br/>
                  <span class="text-white font-semibold">Evals</span> that guard declared behavior.<br/>
                  Feedback becomes capability-checked, reviewable proposals.
                </p>
              </div>
            </div>
            <div class="lg:col-span-6 h-[600px] relative hidden lg:block"></div>
          </div>
        </div>
      </main>
    </div></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
